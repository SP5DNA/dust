[workspace]
members = [".", "crates/cw-core"]
default-members = ["crates/cw-core"]
resolver = "3"

[workspace.package]
version = "0.14.7"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[package]
name = "dust"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Dust — CW Morse group trainer (desktop and WebAssembly)"

[dependencies]
cw-core = { path = "crates/cw-core" }
dioxus = "0.7.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Web / WASM
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Document",
    "Element",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "OscillatorNode",
    "OscillatorType",
    "GainNode",
    "AudioParam",
    "AudioNode",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioScheduledSourceNode",
    "ChannelSplitterNode",
    "DynamicsCompressorNode",
    "IirFilterNode",
    "Storage",
    "WaveShaperNode",
    "OverSampleType",
    "Performance",
    # The paddles, heard from the whole document.
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "Node",
    "UiEvent",
] }

# Linux / desktop
cpal = { version = "0.15", optional = true }
dirs = { version = "6", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["time", "rt"] }

# Linux desktop: the window menu is asked for through GTK, which the webview
# runs on already.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

# iOS: claiming an audio session is what makes the app audible at all, and cpal
# does not do it for us.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "std",
    "AVAudioSession",
    "AVAudioSessionTypes",
] }

[dev-dependencies]
# Renders components to HTML so the screens can be smoke-tested without a window.
dioxus-ssr = "0.7.10"
# Event serialization is off in dioxus's default html features; the UI tests
# fire synthetic clicks and keys through it.
dioxus-html = { version = "0.7.10", features = ["serialize"] }
# `start_paused` runs the session runtime's timers on a virtual clock, so a
# whole training session takes milliseconds and lands on the same instants
# every run.
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt",
    "time",
    "test-util",
] }

# Lint policy lives here rather than only in the CI command line, so a local
# `cargo clippy` is the same check the pipeline runs and a finding shows up
# where it is cheap to fix. Each of these has bitten this codebase or guards
# something it depends on.
[workspace.lints.clippy]
# A `Ref` held across an await outlives the borrow it was taken for and
# panics the next time anything writes. The session runtime is full of both.
await_holding_refcell_ref = "deny"
# Silently dropping a future is how a send goes missing.
let_underscore_future = "deny"
# Cheap to get right, and the audio path allocates per send.
redundant_clone = "deny"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[features]
default = []
web = [
    "dioxus/web",
    "chrono/wasmbind",
    "dep:gloo-timers",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]
# Desktop is the system webview (wry). `dx serve --platform desktop` and the
# shipped installers use this.
desktop = ["dioxus/desktop", "native-runtime", "native-audio", "dep:gtk"]
# Android/iOS still use a system webview. `dx` enables this feature
# automatically for `--platform android`.
mobile = ["dioxus/mobile", "native-runtime", "native-audio"]
# Same, minus the audio backend: a fallback for bringing up a new mobile
# toolchain, since cpal on Android pulls the NDK C++ build for oboe.
mobile-silent = ["dioxus/mobile", "native-runtime", "silent-audio"]
# Storage and timers shared by every non-wasm build.
native-runtime = ["dep:dirs", "dep:tokio"]
# cpal output: ALSA/CoreAudio/WASAPI on desktop, AAudio through oboe on Android.
native-audio = ["dep:cpal"]
# Plays nothing, but keeps a session's timing so the rest of the app is usable.
silent-audio = []

# The band's tests listen to minutes of audio sample by sample; unoptimised,
# that is most of the time the whole suite takes. A little optimisation for
# the core alone keeps them quick without slowing anything else's build.
[profile.test.package.cw-core]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
# `true` is llvm-objcopy --strip-all. Since LLVM 23 that drops every custom
# section, including `__wasm_bindgen_unstable`, so `dx bundle --platform web`
# never produces dust_bg.wasm. Debuginfo is the bulk of what we want gone.
strip = "debuginfo"

[lints]
workspace = true
