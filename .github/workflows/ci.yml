name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, clippy, rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      # The runner has no sound card. ALSA's null device gives cpal a real
      # output to open, so the native audio backend is exercised here rather
      # than skipped.
      - name: Give ALSA a null output device
        run: |
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' > "$HOME/.asoundrc"

      - name: Lint
        run: cargo clippy --workspace --features desktop --all-targets --locked -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Test cw-core
        run: cargo llvm-cov -p cw-core --locked --lcov --output-path lcov-cw-core.info

      - name: Test desktop app
        run: cargo llvm-cov -p dust --features desktop --locked --lcov --output-path lcov-dust.info

      # The web and mobile-silent backends are not part of the coverage run, so
      # lint them here: they share the session runtime with the desktop build
      # and must keep up with it, and code only they compile would otherwise
      # never see the workspace lints.
      - name: Lint the web build
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy -p dust --no-default-features --features web --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Lint the silent build
        run: cargo clippy -p dust --no-default-features --features mobile-silent --all-targets --locked -- -D warnings

      # The silent backend is the only one with no device behind it, so its
      # timing is all a session has to go on: run the app's tests through it.
      - name: Test the silent build
        run: cargo test -p dust --no-default-features --features mobile-silent --locked

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: lcov-cw-core.info,lcov-dust.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  android-check:
    name: Android type-check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Resolve the Android NDK toolchain
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK:-}}}"
          if [[ -z "$ndk" || ! -d "$ndk" ]]; then
            ndk="$(find "$sdk/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [[ -z "$ndk" || ! -d "$ndk" ]]; then
            echo "No Android NDK on this runner."
            exit 1
          fi

          # cpal pulls oboe, whose C++ is built by cc-rs. cc-rs looks for an
          # unversioned `aarch64-linux-android-clang++`, which the NDK does not
          # ship, so point it at the API-versioned wrapper the way `dx` does.
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cc="$bin/aarch64-linux-android24-clang"
          if [[ ! -x "$cc" ]]; then
            cc="$(find "$bin" -maxdepth 1 -name 'aarch64-linux-android*-clang' | sort -V | head -1 || true)"
          fi
          if [[ ! -x "$cc" ]]; then
            echo "No aarch64 clang wrapper in $bin"
            ls "$bin" | head -30
            exit 1
          fi

          echo "NDK: $ndk"
          echo "CC:  $cc"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_NDK_ROOT=$ndk"
            echo "NDK_HOME=$ndk"
            echo "CC_aarch64_linux_android=$cc"
            echo "CXX_aarch64_linux_android=${cc}++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$cc"
          } >> "$GITHUB_ENV"

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-check

      # `cargo check` never links, so this catches mobile regressions without
      # building an APK — including the cpal/oboe C++ that Android audio needs.
      - name: Check the mobile build
        run: cargo check -p dust --no-default-features --features mobile --target aarch64-linux-android --locked

  ios-check:
    name: iOS type-check
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios-check

      # The simulator target needs no signing and no Apple account, so this
      # catches iOS regressions — including the AVAudioSession code and cpal's
      # CoreAudio backend — on every PR. The IPA itself is built on demand by
      # the iOS IPA workflow.
      - name: Check the iOS build
        run: cargo check -p dust --no-default-features --features mobile --target aarch64-apple-ios-sim --locked
