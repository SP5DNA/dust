# Build installers on a version tag (v*) and publish a GitHub Release.
#
# Triggers:
# - git push of v*.*.* tags (`push`)
# - creating a tag in the GitHub UI (`create`)
# - Actions → Release → Run workflow (optional tag input)
#
# GitHub-hosted runners produce Linux, Windows, and macOS desktop bundles
# (each on its native OS). The web app is deployed separately to GitHub Pages.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0). Required when running from a branch."
        required: false
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: "0.7.10"

jobs:
  version:
    name: Check version
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            echo "Run this workflow from a version tag, or pass the tag input."
            exit 1
          fi
          case "$tag" in
            v*.*.*) ;;
            *)
              echo "Tag '$tag' does not match v*.*.*"
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using tag $tag"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Resolve and verify version
        id: version
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          cargo_version="$(awk '
            /^\[workspace.package\]/ { in_pkg = 1; next }
            in_pkg && /^\[/ { in_pkg = 0 }
            in_pkg && /^version *=/ {
              gsub(/[" ]/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          if [[ -z "$cargo_version" ]]; then
            echo "Could not read workspace.package.version from Cargo.toml"
            exit 1
          fi
          tag="${TAG#v}"
          if [[ "$tag" != "$cargo_version" ]]; then
            echo "Tag ${TAG} does not match Cargo.toml version ${cargo_version}"
            exit 1
          fi
          echo "version=${cargo_version}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${cargo_version}"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            platform: linux
            package_types: deb
          - name: Windows
            os: windows-latest
            platform: windows
            package_types: nsis
          - name: macOS
            os: macos-latest
            platform: macos
            package_types: dmg
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Fix rust-objcopy LLVM dylib path
        if: runner.os == 'macOS'
        run: bash scripts/fix-macos-rust-objcopy.sh

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.platform }}
          cache-directories: target/dx

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall "dioxus-cli@${DIOXUS_CLI_VERSION}" --no-confirm --locked \
            || cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked
          dx --version

      - name: Bundle
        run: |
          dx bundle --release --locked \
            --platform "${{ matrix.platform }}" \
            --package-types "${{ matrix.package_types }}" \
            --out-dir dist

      - name: Collect artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p artifacts

          arch_raw="$(uname -m)"
          case "$arch_raw" in
            arm64|aarch64) arch=aarch64 ;;
            x86_64|amd64) arch=x86_64 ;;
            *) arch="$arch_raw" ;;
          esac

          search_roots=""
          if [[ -d dist ]]; then
            search_roots="$search_roots dist"
          fi
          if [[ -d target/dx ]]; then
            search_roots="$search_roots target/dx"
          fi
          if [[ -z "$search_roots" ]]; then
            echo "No bundle output directories were produced"
            ls -la
            exit 1
          fi

          echo "Bundle outputs:"
          find $search_roots -type f | sort | head -200

          # `dx` writes each installer into both dist/ and target/dx, so the same
          # file turns up twice and the second copy used to be attached to the
          # release under its raw name. Keep the first path per basename.
          list="${RUNNER_TEMP}/dust-artifacts.txt"
          find $search_roots -type f \( \
            -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \
            -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
          \) | sort | awk -F/ '!seen[$NF]++' > "$list"

          copied=0
          while IFS= read -r src; do
            [[ -z "$src" ]] && continue
            base="$(basename "$src")"
            # Skip inner payload copies; keep packaged installers.
            if [[ "$base" == "dust.exe" || "$base" == "dust" ]]; then
              continue
            fi
            ext="${base##*.}"
            case "$PLATFORM" in
              linux) dest="dust-${VERSION}-${arch}-unknown-linux-gnu.${ext}" ;;
              windows) dest="dust-${VERSION}-${arch}-pc-windows-msvc-setup.${ext}" ;;
              macos) dest="dust-${VERSION}-${arch}-apple-darwin.${ext}" ;;
              *) dest="dust-${VERSION}-${PLATFORM}.${ext}" ;;
            esac
            if [[ -e "artifacts/${dest}" ]]; then
              dest="dust-${VERSION}-${base}"
            fi
            cp "$src" "artifacts/${dest}"
            copied=$((copied + 1))
          done < "$list"

          if [[ "$copied" -eq 0 ]]; then
            echo "No installer packages found; collecting the raw binary"
            bin=""
            while IFS= read -r src; do
              [[ -z "$src" ]] && continue
              base="$(basename "$src")"
              if [[ "$base" == "dust" || "$base" == "dust.exe" ]]; then
                bin="$src"
              fi
            done < <(find $search_roots -type f \( -name dust -o -name dust.exe \) | sort)
            if [[ -z "$bin" ]]; then
              echo "No installer artifacts or binaries were produced"
              exit 1
            fi
            case "$PLATFORM" in
              windows)
                dest="dust-${VERSION}-${arch}-pc-windows-msvc.exe"
                cp "$bin" "artifacts/${dest}"
                ;;
              linux)
                dest="dust-${VERSION}-${arch}-unknown-linux-gnu.tar.gz"
                tar -czf "artifacts/${dest}" -C "$(dirname "$bin")" "$(basename "$bin")"
                ;;
              macos)
                dest="dust-${VERSION}-${arch}-apple-darwin.tar.gz"
                tar -czf "artifacts/${dest}" -C "$(dirname "$bin")" "$(basename "$bin")"
                ;;
            esac
            copied=1
          fi

          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dust-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # New pipeline: an Android failure must never hold back the desktop release.
    continue-on-error: true
    env:
      ANDROID_TRIPLE: aarch64-linux-android
      NDK_FALLBACK_VERSION: "27.2.12479018"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve the Android SDK and NDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk" || ! -d "$sdk" ]]; then
            echo "No Android SDK on this runner."
            exit 1
          fi

          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK:-}}}"
          if [[ -z "$ndk" || ! -d "$ndk" ]]; then
            ndk="$(find "$sdk/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [[ -z "$ndk" || ! -d "$ndk" ]]; then
            yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_FALLBACK_VERSION}"
            ndk="$sdk/ndk/${NDK_FALLBACK_VERSION}"
          fi

          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "ANDROID_NDK_HOME=$ndk"
            echo "NDK_HOME=$ndk"
          } >> "$GITHUB_ENV"

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-android
          cache-directories: target/dx

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall "dioxus-cli@${DIOXUS_CLI_VERSION}" --no-confirm --locked \
            || cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked
          dx --version

      - name: Bundle APK
        run: |
          set -euo pipefail
          # dx writes the stock robot as the launcher icon and 1 as the
          # version code; the hook puts both right.
          # shellcheck disable=SC1091
          source scripts/android-gradle-hook.sh
          install_android_gradle_hook "$PWD"
          trap 'rm -f "$ANDROID_GRADLE_HOOK"' EXIT
          dx bundle --release --locked \
            --platform android \
            --target "${ANDROID_TRIPLE}" \
            --package-types apk

      - name: Collect APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Bundle outputs:"
          find target/dx -name '*.apk' -type f | sort

          apk="$(find target/dx -name '*.apk' -type f -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          if [[ -z "$apk" ]]; then
            echo "No APK was produced"
            exit 1
          fi
          # shellcheck disable=SC1091
          source scripts/android-gradle-hook.sh
          check_android_apk_version "$PWD" "$apk"
          mkdir -p artifacts
          cp "$apk" "artifacts/dust-${VERSION}-android-arm64.apk"
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dust-android
          path: artifacts/*
          if-no-files-found: error

  ios:
    name: iOS IPA
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    # Unsigned and sideload-only; never let it hold back the other bundles.
    continue-on-error: true
    env:
      IOS_TRIPLE: aarch64-apple-ios
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          components: llvm-tools-preview

      - name: Fix rust-objcopy LLVM dylib path
        run: bash scripts/fix-macos-rust-objcopy.sh

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-ios
          cache-directories: target/dx

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo binstall "dioxus-cli@${DIOXUS_CLI_VERSION}" --no-confirm --locked \
            || cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked
          dx --version

      # `dx` codesigns only when asked, so this is an unsigned .app. Its own .ipa
      # packaging verifies a signature, hence `--package-types ios` plus the
      # Payload zip below.
      - name: Bundle the app
        run: |
          dx bundle --release --locked \
            --platform ios \
            --target "${IOS_TRIPLE}" \
            --package-types ios

      - name: Package an unsigned IPA
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Bundle outputs:"
          find target/dx -maxdepth 6 -name '*.app' -type d | sort

          app="$(find target/dx -name '*.app' -type d | head -1)"
          if [[ -z "$app" ]]; then
            echo "No .app bundle was produced"
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload artifacts
          cp -R "$app" Payload/
          zip -qry "artifacts/dust-${VERSION}-ios-unsigned.ipa" Payload
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dust-ios
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [version, build, android, ios]
    # Publish as long as the desktop bundles are good; Android is best-effort.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum * | tee SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Dust v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
